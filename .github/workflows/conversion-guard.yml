name: Konversiovartija (Shopify-data)

# VARTIJA 3 — poikkeamahälytys Shopifyn OMASTA sessiodatasta, ei PostHogista.
#
# PostHog käynnistyy vasta evästesuostumuksen jälkeen, joten se ei näe kävijöitä,
# joihin esim. evästebannerin klikkaustukos (4.–16.11.2026) osui. Shopify näkee.
#
# Päivittäin: eilisen korilisäykset/sessio ja tilaukset/sessio Pohjoismaissa
# verrattuna edeltävän 7 päivän liukuvaan keskiarvoon. Pudotus yli 50 % →
# punainen. Lisäksi (16.11.2026, VARTIJA 4:n konversio-osa) sessiot maittain,
# kanavittain ja maa×kanava vs 7 pv päiväkeskiarvo: pudotus yli 40 % → punainen.
# Punainen → sähköposti (ALERT_EMAIL) ja WhatsApp-push kun tunnukset ovat
# paikallaan (sama Cloud API ja pohja kuin päiväraportissa).
# Ks. conversion_guard.py — siellä myös miksi vain Pohjoismaat (bottiliikenne).
#
# Vaatii teemasovelluksen Shopify-sovellukselta read_reports-oikeuden
# (ShopifyQL). Ilman sitä ajo on punainen virheellä "ShopifyQL GraphQL-virhe".

on:
  schedule:
    - cron: "40 5 * * *"   # 07:40 Suomen talviaikaa; Shopifyn sessiodata eiliseltä on valmis
  workflow_dispatch:
    inputs:
      date:
        description: "Tarkasteltava päivä (YYYY-MM-DD), tyhjä = eilen"
        required: false
        default: ""
      dry_run:
        description: "Älä lähetä sähköpostia eikä WhatsApp-pushia"
        type: boolean
        default: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Aja konversiovartija
        env:
          SHOPIFY_SHOP:          ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION:   ${{ secrets.SHOPIFY_API_VERSION || '2025-10' }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLICKUP_API_KEY:       ${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_LIST_ID:       ${{ secrets.CLICKUP_LIST_ID }}
          TIMEZONE:              Europe/Helsinki
          # Sähköposti on pääkanava kunnes WhatsApp-tunnukset ovat paikallaan
          # (samat SMTP-secretit kuin daily-report.yml:ssä).
          ALERT_EMAIL:           ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST:             smtp.gmail.com
          SMTP_PORT:             587
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          WHATSAPP_ACCESS_TOKEN:     ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID:  ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ALERT_RECIPIENTS: ${{ secrets.WHATSAPP_ALERT_RECIPIENTS }}
          WHATSAPP_REPORT_TEMPLATE:  ${{ secrets.WHATSAPP_REPORT_TEMPLATE }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python conversion_guard.py $ARGS
